<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Solar Odyssey — 3D Solar System Game</title>
  <meta name="description" content="Solar Odyssey: explore a 3D solar system, fly a spaceship, land on planets, mine asteroids, run missions and upgrade your ship." />
  <meta name="theme-color" content="#02030a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='14' fill='%23ffc84a'/%3E%3Ccircle cx='78' cy='34' r='10' fill='%232f6fd0'/%3E%3Cpath d='M62 40 a 36 18 0 1 1 -24 -14' stroke='%23d8bd84' stroke-width='4' fill='none'/%3E%3C/svg%3E" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <canvas id="scene" aria-label="Solar Odyssey 3D viewport"></canvas>

  <div id="boot">
    <div class="boot-card">
      <div class="boot-logo">
        <div class="boot-sun"></div>
        <h1>SOLAR ODYSSEY</h1>
        <p>Initializing navigation systems…</p>
      </div>
      <div class="boot-bar"><i id="boot-fill"></i></div>
      <div class="boot-log" id="boot-log">Booting…</div>
      <noscript><div class="boot-noscript">This game needs JavaScript. Please enable it.</div></noscript>
    </div>
  </div>

  <div id="ui-root"></div>

  <div id="error-layer" hidden></div>
</body>
</html>
